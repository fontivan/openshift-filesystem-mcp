---
# SPDX-License-Identifier: Apache-2.0
# Pod Security: this namespace runs a workload that requires hostPath volumes and
# runAsUser=0 + seLinuxOptions for read-only host introspection, so it cannot
# comply with "restricted". Enforcing "privileged" for this namespace only.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-filesystem-mcp
  labels:
    app.kubernetes.io/name: openshift-filesystem-mcp
    app.kubernetes.io/part-of: openshift-filesystem-mcp
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
