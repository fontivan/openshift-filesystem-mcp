---
# SPDX-License-Identifier: Apache-2.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openshift-filesystem-mcp

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: openshift-filesystem-mcp
    includeSelectors: true
    includeTemplates: true

# Image is set at deploy time via make deploy (uses IMG / QUAY_WORKSPACE)
images:
  - name: quay.io/REPLACE_WITH_YOUR_USERNAME/openshift-filesystem-mcp
