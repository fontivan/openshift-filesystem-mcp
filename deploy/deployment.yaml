---
# SPDX-License-Identifier: Apache-2.0
# Two-container MCP deployment:
# - backend: Node.js (mcp-proxy + server-filesystem) on port 8081
# - proxy: MCP proxy with transforms on port 8080 (receives client traffic)
# Requires ServiceAccount with hostpath-readonly SCC. Host paths mounted readOnly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-filesystem-mcp
  namespace: openshift-filesystem-mcp
  labels:
    app.kubernetes.io/name: openshift-filesystem-mcp
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-filesystem-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-filesystem-mcp
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: openshift-filesystem-mcp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # No pod-level runAsUser/runAsNonRoot: backend runs as root to read host mounts; proxy runs non-root.
      containers:
        - name: backend
          image: quay.io/REPLACE_WITH_YOUR_USERNAME/openshift-filesystem-mcp-backend:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            readOnlyRootFilesystem: true
            seLinuxOptions:
              type: spc_t
          env:
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: PORT
              value: "8081"
            - name: MCP_HOST_ROOT
              value: /host
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-usr
              mountPath: /host/usr
              readOnly: true
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        - name: proxy
          image: quay.io/REPLACE_WITH_YOUR_USERNAME/openshift-filesystem-mcp-proxy:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          env:
            - name: PORT
              value: "8080"
            - name: MCP_BACKEND_URL
              value: "http://127.0.0.1:8081/mcp"
            - name: MCP_EXPOSE_WRITE_TOOLS
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-usr
          hostPath:
            path: /usr
            type: Directory
