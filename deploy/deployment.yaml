---
# SPDX-License-Identifier: Apache-2.0
# MCP server-filesystem Deployment: read-only host /etc, /sys, /proc via HTTP/SSE.
# Requires ServiceAccount with hostpath-readonly SCC in OpenShift (see serviceaccount.yaml and deploy/scc-hostpath-readonly.yaml).
# Host paths are mounted readOnly; pod runs non-root with read-only root FS. No write access to host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-filesystem-mcp
  namespace: openshift-filesystem-mcp
  labels:
    app.kubernetes.io/name: openshift-filesystem-mcp
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshift-filesystem-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshift-filesystem-mcp
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: openshift-filesystem-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: openshift-filesystem-mcp
          # Image replaced by kustomize on 'make deploy IMG=...' (build from Dockerfile).
          image: quay.io/REPLACE_WITH_YOUR_USERNAME/openshift-filesystem-mcp:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
          env:
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: host-etc
          hostPath:
            path: /etc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
