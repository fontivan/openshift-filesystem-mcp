---
# SPDX-License-Identifier: Apache-2.0
# This ServiceAccount is required for mounting host paths (/etc, /sys, /proc).
# In OpenShift, create the custom hostpath-readonly SCC (make apply-scc) then grant it
# so the pod can use hostPath volumes. Host mounts are read-only in the Deployment.
# Example:
#
#   make apply-scc && make grant-scc
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshift-filesystem-mcp
  namespace: openshift-filesystem-mcp
  labels:
    app.kubernetes.io/name: openshift-filesystem-mcp
    app.kubernetes.io/component: server
