---
# SPDX-License-Identifier: Apache-2.0
# Build container image on push to main and on PRs targeting main.
name: Container build

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: make container-build CONTAINER_ENGINE=docker IMG=openshift-filesystem-mcp:ci
